[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unequaltime"
version = "0.1.0"
description = "Unequal-time angular power spectra Z_ell(omega, omega') of galaxy catalogues: estimator, linear theory and covariance"
readme = "README.md"
authors = [{name = "Oliver Philcox", email = "ophilcox@stanford.edu"}]
requires-python = ">=3.10"
dependencies = ["numpy>=2", "scipy", "healpy", "pymaster>=2"]

[project.optional-dependencies]
examples = ["matplotlib", "jupyter"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/oliverphilcox/UnequalTime"

[tool.setuptools]
packages = ["unequaltime"]
