[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unequaltime"
version = "0.1.0"
description = "Unequal-time angular power spectra Z_ell(omega, omega') of galaxy catalogues"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "healpy", "pymaster"]
